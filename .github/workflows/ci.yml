# main is stable, staging is where new work lands first. Every push and pull
# request is checked and built; a push to staging also refreshes the rolling
# "staging-latest" pre-release (never reported as the latest release, so stable
# installs are not offered it).
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: client-agent
      # typecheck covers the shipped roleplay app, which has its own packages
      - run: bun install --frozen-lockfile
        working-directory: apps/roleplay
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          base=$(jq -r .version package.json)
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "version=$base-staging.$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets: inherit

  staging-release:
    name: Publish staging pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [version, check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: staging-release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Replace the staging pre-release
        run: |
          gh release delete staging-latest --yes --cleanup-tag || true
          gh release create staging-latest \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Staging $VERSION" \
            --notes "Bleeding-edge build of \`staging\` at $GITHUB_SHA. Expect rough edges; stable downloads are on the [latest release](https://github.com/${{ github.repository }}/releases/latest).

          The Android app installs as **Chrysalis Staging**, next to the stable app, with its own data." \
            assets/*.zip assets/*.tar.gz assets/*.apk
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the staging image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: CHRYSALIS_VERSION=${{ env.VERSION }}
          tags: ghcr.io/projectchrysalis/chrysalis-engine:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
