# main is stable, staging is where new work lands first. Every push and pull
# request is checked and built; a push to staging also refreshes the rolling
# "staging-latest" pre-release (never reported as the latest release, so stable
# installs are not offered it).
name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: client-agent
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test

  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          base=$(jq -r .version package.json)
          if [ "$GITHUB_REF" = "refs/heads/staging" ]; then
            echo "version=$base-staging.$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  staging-release:
    name: Publish staging pre-release
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: [version, check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    concurrency:
      group: staging-release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Replace the staging pre-release
        run: |
          gh release delete staging-latest --yes --cleanup-tag || true
          gh release create staging-latest \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Staging $VERSION" \
            --notes "Bleeding-edge build of \`staging\` at $GITHUB_SHA. Expect rough edges; stable downloads are on the [latest release](https://github.com/${{ github.repository }}/releases/latest).

          The Android app installs as **Chrysalis Staging**, next to the stable app, with its own data." \
            assets/*.zip assets/*.tar.gz assets/*.apk
          # published only once every file is up, so no install sees it half uploaded
          gh release edit staging-latest --draft=false --prerelease
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the staging image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: CHRYSALIS_VERSION=${{ env.VERSION }}
          tags: ghcr.io/projectchrysalis/chrysalis-engine:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max
