# Stable release: push a tag like v1.2.3 on main (matching package.json).
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Optional repository secrets:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD   sign the APK (base64 of the .jks file)
#   NPM_TOKEN              publish chrysalis-engine to npm
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: |
          want="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::stable releases are tagged on main"; exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    secrets: inherit

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Chrysalis ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            assets/*.zip assets/*.tar.gz assets/*.apk
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/projectchrysalis/chrysalis-engine:latest
            ghcr.io/projectchrysalis/chrysalis-engine:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v4
        if: env.NPM_TOKEN != ''
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public assets/*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
