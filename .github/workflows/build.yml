# Builds every download once on Linux, then starts each one on the OS it is
# for. Called by ci.yml (every push and pull request) and release.yml (tags).
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version to stamp on the build; empty uses package.json
        type: string
        default: ""
      apk:
        description: Build the Android APK
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.0
  CHRYSALIS_VERSION: ${{ inputs.version }}

jobs:
  binaries:
    name: Build downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: client-agent
      - run: bun run dist windows-x64 macos-arm64 macos-x64 linux-x64 linux-arm64 npm
      - name: Pack the npm package
        run: |
          mkdir -p out/dist/npm-pack
          cd out/dist/npm && npm pack --pack-destination ../npm-pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: downloads
          path: |
            out/dist/*.zip
            out/dist/*.tar.gz
            out/dist/npm-pack/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  apk:
    name: Build Android APK
    if: inputs.apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: client-agent
      - name: Load the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CHRYSALIS_ANDROID_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "APK signed with the release key"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is debug-signed and cannot update an installed release"
          fi
      - run: bun run dist android-apk
        env:
          CHRYSALIS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHRYSALIS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHRYSALIS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Check the APK
        run: |
          apk=$(ls out/dist/*.apk)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/aapt2" dump badging "$apk" | head -3
          "$tools/apksigner" verify --print-certs "$apk" | head -3
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk
          path: out/dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  smoke:
    name: Run on ${{ matrix.target }}
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-latest }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: windows-x64, os: windows-latest }
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x64, os: macos-15-intel }
          - { target: npm, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      # only the smoke script and package.json: no node_modules, so the
      # download has to stand on its own
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/smoke.ts
            package.json
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: downloads
          path: ${{ runner.temp }}/downloads
      - name: Unpack
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          mkdir app && cd app
          case "${{ matrix.target }}" in
            npm) tar -xzf ../downloads/npm-pack/*.tgz && echo "CMD=bun $PWD/package/chrysalis.js" >> "$GITHUB_ENV" ;;
            windows-x64) 7z x -bso0 ../downloads/*-windows-x64.zip && echo "CMD=$(cygpath -w "$(ls -d "$PWD"/Chrysalis-*)")\\chrysalis.exe" >> "$GITHUB_ENV" ;;
            *) tar -xzf ../downloads/*-${{ matrix.target }}.tar.gz && echo "CMD=$(ls -d "$PWD"/Chrysalis-*)/chrysalis" >> "$GITHUB_ENV" ;;
          esac
      - name: Smoke test
        shell: bash
        run: bun run scripts/smoke.ts $CMD

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: chrysalis:test
          build-args: CHRYSALIS_VERSION=${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it
        run: |
          docker run -d --name chrysalis -p 8788:8788 chrysalis:test
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8788/v1/health; then break; fi
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:8788/v1/health | grep -q '"ok":true'
          docker logs chrysalis 2>&1 | grep -q '#setup='
          echo "container is up and printed its setup link"
      - if: failure()
        run: docker logs chrysalis || true
